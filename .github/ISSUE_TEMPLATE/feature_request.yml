name: Feature request
description: Propose an improvement to the skill, the playbook or the scripts.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or situation does sumo handle badly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change and how it would work.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A bout, a paper or a technique that supports the change. sumo asks for evidence; so do we.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
